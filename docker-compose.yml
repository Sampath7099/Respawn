services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: respawn
      POSTGRES_PASSWORD: respawn
      POSTGRES_DB: respawn
    ports: ["127.0.0.1:5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U respawn"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6380:6379"]

  redpanda:  # Kafka-compatible broker, single binary, light on RAM
    image: redpandadata/redpanda:v24.2.7
    command: >
      redpanda start --overprovisioned --smp 1 --memory 512M --mode dev-container
      --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
    ports: ["127.0.0.1:19092:19092"]

  api:
    build: {context: ., dockerfile: backend/Dockerfile}
    depends_on:
      postgres: {condition: service_healthy}
    environment: &app_env
      RESPAWN_DSN: postgresql://respawn:respawn@postgres:5432/respawn
      REDIS_URL: redis://redis:6379/0
      KAFKA_BROKERS: redpanda:9092
      RESPAWN_ENV: production
      CACHE: ${CACHE:-on}  # CACHE=off disables cache-aside, for the load-test comparison
      JWT_SECRET: ${JWT_SECRET:?copy .env.example to .env and set JWT_SECRET}
    volumes: ["./recsys/artifacts:/srv/recsys/artifacts:ro"]
    # localhost only: the public entry point is nginx (frontend), which sets X-Forwarded-For
    ports: ["127.0.0.1:8010:8010"]

  relay-publish:  # store.outbox -> Kafka "events"
    build: {context: ., dockerfile: backend/Dockerfile}
    command: python -m app.relay publish
    depends_on: [api, redpanda]
    environment: *app_env
    restart: unless-stopped

  sink-warehouse:  # "events" -> raw.events
    build: {context: ., dockerfile: backend/Dockerfile}
    command: python -m app.relay warehouse
    depends_on: [redpanda, postgres]
    environment: *app_env
    restart: unless-stopped

  sink-trending:  # "events" -> Redis trending counters
    build: {context: ., dockerfile: backend/Dockerfile}
    command: python -m app.relay trending
    depends_on: [redpanda, redis]
    environment: *app_env
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on: [api]
    ports: ["3000:80"]

  airflow:
    image: apache/airflow:2.10.4-python3.12
    command: standalone
    profiles: ["pipeline"]
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/respawn/pipeline/dags
      # the bootstrap DAG runs the simulator, which serves the trained model (numpy + xgboost)
      _PIP_ADDITIONAL_REQUIREMENTS: "dbt-postgres==1.9.0 psycopg[binary] numpy xgboost"
      RESPAWN_DSN: postgresql://respawn:respawn@postgres:5432/respawn
      PGHOST: postgres
      PGPORT: "5432"
    ports: ["127.0.0.1:8080:8080"]
    volumes: [".:/opt/respawn"]

volumes:
  pgdata:
