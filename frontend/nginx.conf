server {
    listen 80;
    root /usr/share/nginx/html;

    # same-origin API: no CORS needed in production
    location /api/ {
        proxy_pass http://api:8010/;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # single-page app: unknown paths serve index.html and React Router takes over
    location / {
        try_files $uri /index.html;
    }
}
